<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Links -->
    <link rel="icon" href="./assets/favicons/favicon-16x16.png">
    <link rel="stylesheet" href="./assets/css/style.css">

    <title>Pokedex</title>
</head>
<body>
    <main>
        <img src="" alt="pokemon" class="pokemon__image">
        <h1 class="pokemon__data">
            <span class="pokemon__number">6</span>
            <span class="pokemon__name">charizard</span>
        </h1>

        <form class="form">
            <input
            type="search"
            class="input__search"
            placeholder="Name or Number"
            required
            />
        </form>
        
        <img src="./assets/images/pokedex.png" alt="pokedex" class="pokedex">
    </main>
</body>
</html>
